name: MapperLab Backtest

on:
  schedule:
    - cron: '0 6 * * 1'      # Every Monday 6:00 UTC
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: false
        default: '2020-01-01'
      end_date:
        description: 'End date (YYYY-MM-DD, leave blank for today)'
        required: false
        default: ''
      initial_capital:
        description: 'Starting capital (USD)'
        required: false
        default: '1000000'
      benchmark:
        description: 'Benchmark ticker symbol'
        required: false
        default: 'SPY'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backtest/requirements.txt'

      - name: Install Python dependencies
        run: pip install -r backtest/requirements.txt

      - name: Create output directory
        run: mkdir -p backtest/output

      - name: Run backtest
        run: |
          python backtest/run_backtest.py \
            --start "${{ github.event.inputs.start_date || '2020-01-01' }}" \
            --end   "${{ github.event.inputs.end_date || '' }}" \
            --capital "${{ github.event.inputs.initial_capital || '1000000' }}" \
            --benchmark "${{ github.event.inputs.benchmark || 'SPY' }}" \
            --output-dir backtest/output

      - name: Upload backtest artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-${{ github.run_number }}
          path: backtest/output/
          retention-days: 90

      - name: Write step summary
        if: always()
        run: |
          if [ -f backtest/output/summary.md ]; then
            cat backtest/output/summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## Backtest did not produce a summary" >> $GITHUB_STEP_SUMMARY
          fi
