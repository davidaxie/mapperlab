name: Daily Score Snapshot & Signal

on:
  schedule:
    - cron: '0 21 * * 1-5'   # Mon–Fri 9pm UTC (after NYSE close ~4pm EST)
  workflow_dispatch:
    inputs:
      server_url:
        description: 'MapperLab server URL'
        required: false
        default: 'https://mapperlab.co'

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # needed to commit score_history file

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backtest/requirements.txt'

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Fetch live scores and generate signals
        env:
          SERVER_URL: ${{ github.event.inputs.server_url || 'https://mapperlab.co' }}
        run: python backtest/daily_snapshot.py --server-url "$SERVER_URL"

      - name: Commit score snapshot
        run: |
          git config user.name  "MapperLab Bot"
          git config user.email "bot@mapperlab.co"
          git add data/score_history.jsonl data/signals.jsonl || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: daily score snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload signal report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-signals-${{ github.run_number }}
          path: data/
          retention-days: 30

      - name: Write step summary
        if: always()
        run: |
          if [ -f data/signal_summary.md ]; then
            cat data/signal_summary.md >> $GITHUB_STEP_SUMMARY
          fi
